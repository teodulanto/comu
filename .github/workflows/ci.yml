name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare whisper.cpp runtime
        shell: powershell
        run: npm run prepare:whisper

      - name: Build frontend
        run: npm run build

      - name: Check Rust
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
